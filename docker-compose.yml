version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: imsdb
      POSTGRES_USER: imsuser
      POSTGRES_PASSWORD: imspassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://imsuser:imspassword@db:5432/imsdb
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
